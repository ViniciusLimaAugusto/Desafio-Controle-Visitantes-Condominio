name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.9
          uv sync --locked
      - name: Lint and format
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Run tests
        run: uv run --locked pytest
      - name: Build container image
        run: docker build -t visitor-control:ci .
      - name: Start container and verify readiness
        run: |
          docker run --detach --name visitor-ci --publish 127.0.0.1::8000 visitor-control:ci
          trap 'docker logs visitor-ci; docker rm --force visitor-ci' EXIT
          address=$(docker port visitor-ci 8000/tcp)
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            --max-time 3 --retry-max-time 15 "http://$address/health"
