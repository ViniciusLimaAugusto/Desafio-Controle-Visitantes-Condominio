[project]
name = "condominium-visitor-control"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135,<1",
    "pydantic>=2.12,<3",
    "sqlalchemy>=2.0,<2.2",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=9,<10", "ruff>=0.15,<1"]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
